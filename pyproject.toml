[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proofpilot"
version = "1.0.0"
description = "ProofPilot: a verified, multi-step STEM agent (plan -> solve -> verify -> repair) with traceable output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.5",
  "sympy>=1.12",
  "numpy>=1.26",
  "scipy>=1.11",
  "networkx>=3.2",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=2.0",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
ui = ["streamlit>=1.40"]

[project.scripts]
proofpilot = "proofpilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
